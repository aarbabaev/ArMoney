openapi: 3.0.3
info:
  title: wallet-service
  version: 0.1.0
  description: Wallet lifecycle and durable asynchronous ledger provisioning. Balances belong to ledger.
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access its database (gateway has no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/wallets:
    get:
      operationId: listWallets
      security:
      - ServiceKey: []
        VerifiedIdentity: []
      responses:
        '200':
          description: Current identity wallets including provisioning state, sorted by currency
          content:
            application/json:
              schema:
                type: object
                required: [wallets]
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wallet'
        '401':
          description: Missing or invalid identity
        '503':
          description: Wallet database unavailable
    post:
      operationId: openWallet
      description: >-
        Creates durable provisioning intent and returns immediately. ACTIVE PENDING returns
        202; READY or existing CLOSED returns 200. Poll GET for readiness. Retries preserve
        wallet identity and never reopen CLOSED wallets. A background worker retries ledger
        with the stable wallet ID. Ledger outage leaves PENDING. Existing ACTIVE wallets
        are reconciled after migration. No balances are held in wallet-service.
      security:
      - ServiceKey: []
        VerifiedIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [currency]
              properties:
                currency:
                  type: string
                  enum: [EUR, USD, GBP]
      responses:
        '200':
          description: Confirmed READY wallet or existing CLOSED wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '202':
          description: ACTIVE wallet with durable PENDING ledger provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Wallet database unavailable
components:
  schemas:
    Wallet:
      type: object
      required: [id, owner_id, currency, status, provisioning_status, ledger_account_id]
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        currency:
          type: string
          enum: [EUR, USD, GBP]
        status:
          type: string
          enum: [ACTIVE, CLOSED]
        provisioning_status:
          type: string
          enum: [PENDING, READY]
          description: READY proves a confirmed ledger mapping, not funding.
        ledger_account_id:
          type: string
          format: uuid
          nullable: true
          description: Null while PENDING; immutable once READY.
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    VerifiedIdentity:
      type: apiKey
      in: header
      name: X-Identity-Id
      description: Gateway-verified auth identity UUID
