        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the presented session; repeat requests with the same well-formed token are harmless.
      security: [{ServiceKey: [], BearerAuth: []}]
      responses:
        '204':
          description: Session removed, or already absent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/internal/migrations/legacy/decision:
    post:
      operationId: readLegacyMigrationDecision
      description: Private Auth PRIMARY readback, selected only by explicit default-OFF migration configuration. Dedicated
        decision credential precedes parsing; no X-Service-Key substitution. Strict duplicate-free JSON <=12 KiB,
        HTTP/1.1 absolute four-second body-read deadline, local 16-call/120-per-minute admission. Historical read
        only; no event, session, grant or expiry renewal.
      security:
      - MigrationDecisionKey: []
      x-max-body-bytes: 12288
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationDecisionQuery'
      responses:
        '200':
          description: Durably bound result; not a banking grant
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationDecision'
        '400':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '401':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '409':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '429':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '503':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '404':
          description: Unregistered when the selecting feature is disabled
  /v1/internal/migrations/legacy/publication-evidence:
    post:
      operationId: readLegacyMigrationPublicationEvidence
      description: Private default-OFF Auth PRIMARY publication evidence read. Same dedicated decision credential
        and bounded strict 12 KiB HTTP/1.1 body/readback admission as decision. Original tuple/key/provenance must
        match; unavailable or malformed state never becomes positive evidence.
      security:
      - MigrationDecisionKey: []
      x-max-body-bytes: 12288
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationEvidenceQuery'
      responses:
        '200':
          description: Durably bound result; not a banking grant
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationPublicationEvidence'
        '400':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '401':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '409':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '429':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '503':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '404':
          description: Unregistered when the selecting feature is disabled
  /v1/internal/migrations/legacy/user-mutation-suspend:
    post:
      operationId: suspendMigrationForUserMutation
      description: 'Private User-to-Auth purpose endpoint, unregistered unless AUTH_MIGRATION_USER_REVISION_ENABLED=true
        (default false). Credential before body/protocol/admission; strict JSON <=4096 bytes; HTTP/1.1 four-second
        absolute body deadline. One shared 20/2 admission and global16 PRIMARY permit; same owned backend and final
        original invocation checks. Exact immutable receipt replay precedes the 100000-retained-row cap; changed payload/owner
        conflicts. NOT_MIG is restricted to genuine permanent REG/current receipts/original projection-command provenance.
        Current release lacks a genuine MIG projection-command producer: unsupported MIG operations return503 with
        no Auth receipt/transition or User write. No fallback from unknown/pending/expired migration and no positive
        authority.'
      security:
      - MigrationUserMutationKey: []
      x-max-body-bytes: 4096
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MigrationUserMutationRequest'
      responses:
        '200':
          description: Durably bound result; not a banking grant
          headers:
            Cache-Control:
              schema:
                type: string
                enum:
                - no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MigrationUserMutationResponse'
        '400':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '401':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '409':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '429':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '503':
          $ref: '#/components/responses/MigrationPrivateFailure'
        '404':
          description: Unregistered when the selecting feature is disabled
  /migration/legacy:
    get:
      operationId: legacyMigrationForm
      description: No query fields. Issues only form CSRF/server command custody; no account authority. An active
        existing attempt is denied without implicit retirement.
      security:
      - MigrationGatewayKey: []
        MigrationOriginAssertion: []
      responses:
        '200':
          $ref: '#/components/responses/MigrationBrowserHtml'
        '400':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '401':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '409':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '429':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '503':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '404':
          description: Unregistered when migration browser configuration is disabled
      parameters:
      - in: cookie
        name: __Secure-ArMoneyMigrationAttempt
        required: false
        schema:
          type: string
          minLength: 43
          maxLength: 43
          pattern: ^[A-Za-z0-9_-]{43}$
        description: Original opaque server-issued HttpOnly binder, never a caller identity/proof claim.
      - in: header
        name: Origin
        required: false
        schema:
          type: string
          format: uri
        description: Exact configured HTTPS public origin; required on POST, checked if present on GET. Duplicate
          Origin headers are rejected.
      tags:
      - LegacyMigrationBrowser
  /migration/legacy/password:
    post:
      operationId: legacyMigrationPassword
      description: Exact form fields authenticate the existing historical email/password in one owned scope; no owner
        allocation, contact link or early session revocation.
      security:
      - MigrationGatewayKey: []
        MigrationOriginAssertion: []
      responses:
        '200':
          $ref: '#/components/responses/MigrationBrowserHtml'
        '400':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '401':
          $ref: '#/components/responses/MigrationBrowserFailure'
        '409':
          $ref: '#/components/responses/MigrationBrowserFailure'
