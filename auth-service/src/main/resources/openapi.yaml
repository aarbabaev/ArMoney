          maxLength: 128
          minLength: 15
          description: At least 15 code points and at most 128 UTF-16 code units, matching historical Auth validation.
      description: Historical email login only; generic credential failure. No identity UUID, frontend PKCE verifier
        or provider token input.
    MigrationEmailForm:
      type: object
      additionalProperties: false
      required:
      - csrf
      - command_id
      - email
      properties:
