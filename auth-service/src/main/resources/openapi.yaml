openapi: 3.0.3
info:
  title: auth-service
  version: 0.1.0
  description: Operational API and identity registration/session API. New registrations require an immutable unique UAE mobile claim. Local email and phone ownership are not verified. Trusted SSO email verification is retained separately for private notification contact lookup.
tags:
  - name: LegacyMigrationBrowser
    description: 'Implemented private Gateway-to-Auth browser handler; selected only by strict AUTH_MIGRATION_BROWSER_ENABLED=true
      (default false), not enabled by this document. Dedicated Gateway credential and exact public-origin assertion
      precede cookies/body/facade; caller Forwarded/identity/Authorization/X-Service-Key headers are rejected. POST
      requires exact HTTPS public Origin and strict duplicate-free application/x-www-form-urlencoded <=8192 bytes
      with a four-second absolute HTTP/1.1 body-read deadline. Cookies are host-only __Secure-ArMoneyMigrationForm/Account/Attempt,
      Path=/migration/, Secure, HttpOnly, SameSite=Lax and original deadline <=120 seconds; no Domain, renewal or
      raw capability JSON. Wrong binders cannot clear/replace a valid flow. Malformed Gateway/origin assertions are
      rejected with 400; authenticated service-level credential denials may return 401. '
paths:
  /internal/enrollments:
    {
      "post": {
        "operationId": "stageVerificationEnrollment",
        "description": "Private default-disabled authority bridge. Full six-field server binding is mandatory in authority mode. No gateway exposure or ACTIVE/banking eligibility. Unregistered when the new flag is false; legacy constructor mode is separate. Body bounded to 12 KiB; credentials precede parsing.",
        "security": [
          {
            "VerificationBridge": []
          }
        ],
        "requestBody": {
          "required": true,
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/AuthorityEnrollmentRequest"
              }
            }
          }
        },
        "responses": {
          "200": {
            "description": "Operation result; not banking authorization",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/AuthorityEnrollmentResponse"
                }
              }
            }
          },
          "400": {
            "description": "Invalid bounded request",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "401": {
            "description": "Missing or invalid bridge credential",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "404": {
            "description": "Route is unregistered when authority bridge is disabled; missing enrollment is not a 404 authority-mode contract",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "409": {
            "description": "Conflict, stale or expired enrollment/contact/flow/challenge",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "429": {
            "description": "Admission, concurrency or attempt limit",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "503": {
            "description": "Observation or staged authority unavailable",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          },
          "413": {
            "description": "Request body exceeds the 12 KiB bound",
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/Error"
                }
              }
            }
          }
        }
      }
    }
