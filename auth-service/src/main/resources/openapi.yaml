        command_id:
          $ref: '#/components/schemas/MigrationUuid'
        email:
          type: string
          format: email
          maxLength: 254
      description: Explicit canonical email candidate after genuine account proof; a candidate does not assert possession.
        Provider email is not copied as authority.
    MigrationOtpForm:
      type: object
      additionalProperties: false
      required:
      - csrf
      - command_id
      - code
      properties:
        csrf:
          $ref: '#/components/schemas/MigrationCsrf'
        command_id:
          $ref: '#/components/schemas/MigrationUuid'
