      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
          description: Null for SSO identities; never used to link accounts.
          format: email
    Session:
      type: object
      required: [access_token, token_type, expires_in, expires_at]
      properties:
        access_token:
          type: string
          minLength: 43
          maxLength: 43
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          maximum: 1800
          description: Legacy sessions advertise 1800 seconds. Managed sessions advertise the positive whole seconds remaining; an already expired or subsecond remaining managed lifetime is rejected.
        expires_at:
          type: string
          format: date-time
    Registration:
      type: object
      additionalProperties: false
      required: [email, password, phone_number]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; ASCII email addresses only.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: At least 15 Unicode code points, at most 128 UTF-16 code units; never trimmed.
        phone_number:
          type: string
          pattern: '^\+9715[024568][0-9]{7}$'
          description: Exact canonical UAE mobile claim; immutable and unique across legacy and SSO identities. Does not attest possession.
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; ASCII email addresses only in this version.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: At least 15 Unicode code points, at most 128 UTF-16 code units; never trimmed.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  securitySchemes:
    MigrationDecisionKey:
      type: apiKey
      in: header
      name: X-ArMoney-Migration-Decision-Key
    MigrationUserMutationKey:
      type: apiKey
      in: header
      name: X-ArMoney-Migration-User-Mutation-Key
    MigrationGatewayKey:
      type: apiKey
      in: header
      name: X-ArMoney-Migration-Auth-Key
    MigrationOriginAssertion:
      type: apiKey
      in: header
      name: X-ArMoney-Migration-Origin
      description: Exact configured HTTPS public origin asserted only by the authenticated private Gateway hop; not
        a user identity.
    VerificationBridge:
      {
        "type": "apiKey",
        "in": "header",
        "name": "X-ArMoney-SSO-Bridge-Key"
      }
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque random session token
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  requestBodies:
    Registration:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Registration'
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    MigrationPrivateFailure:
      description: Generic rejected/conflict/unavailable result only; no provider, credential, request body or exception
        details.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    MigrationBrowserHtml:
      description: Bounded HTML form or read-only result. No raw proof, OTP, capability or access/refresh/session token
        is returned as JSON. COMPLETED instructs a fresh native sign-in; it does not mint a banking session.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        text/html:
          schema:
            type: string
    MigrationBrowserFailure:
      description: Generic HTML rejection/unavailability; no raw inputs, codes, credentials or exception text.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
      content:
        text/html:
          schema:
            type: string
    MigrationBrowserRedirect:
      description: 303 to the fixed trusted authorization endpoint with exact server-created code/openid/S256/prompt=login/max_age=0
        request. No caller redirect or verifier.
      headers:
        Cache-Control:
          schema:
            type: string
            enum:
            - no-store
        Location:
          schema:
            type: string
            format: uri
        Set-Cookie:
          schema:
            type: string
          description: Host-only __Secure-ArMoneyMigrationAttempt; Path=/migration/; Secure; HttpOnly; SameSite=Lax;
            bounded by the original deadline, never renewed.
    BadRequest:
      description: Malformed JSON, invalid email, password or registration phone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Generic registration_conflict; an email, phone or durable user-service claim conflicts. No account linking or credential replacement occurs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing service identity or invalid session/credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 4096 bytes (12288 for SSO exchange)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Attempt or concurrency limit reached; Retry-After specifies seconds
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
