  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access its database (gateway has no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/internal/identities/{id}/email:
    get:
      operationId: identityEmailContact
      description: Private service-key-only notification contact lookup, never exposed through the gateway. Uses auth identity UUID, not profile ID. Local login email is an unverified fallback. Verification is a trusted provider assertion, not a local verification flow. Shared keys do not isolate compromised peers.
      security: [{ServiceKey: []}]
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Existing identity contact, including null when unavailable; Cache-Control no-store
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required: [email, verified]
                properties:
                  email:
                    type: string
                    format: email
                    nullable: true
                  verified:
                    type: boolean
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Identity not found
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/register:
    post:
      operationId: register
      description: Reserves a unique canonical UAE mobile number and provisions its user-service claim. An identical email and phone retry preserves the identity and password. Conflicting email or phone claims return a generic conflict. A dependency failure may leave a durable identity for a later registration or credential-authenticated login retry.
      security: [{ServiceKey: []}]
      requestBody:
        $ref: '#/components/requestBodies/Registration'
      responses:
        '202':
          description: Registration processed and user-service acknowledged the immutable claim (also returned for an identical email and phone retry)
          content:
            application/json:
              schema:
                type: object
                required: [message]
                properties:
                  message:
                    type: string
                    enum: [registration_processed]
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/login:
    post:
      operationId: login
      description: Verifies credentials and reasserts the registered phone in user-service before issuing a session. Historical identities with no registered phone retain login compatibility without automatic enrollment.
      security: [{ServiceKey: []}]
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: New 30-minute opaque session; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/sso:
    post:
      operationId: exchangeSsoToken
      description: Validates a Keycloak access token and creates an independent 30-minute opaque local session after user-service acknowledges the phone claim. New issuer/subject mappings require a canonical UAE phone_number from trusted introspection. An existing registered phone must match exactly and cannot be omitted. Historical phone-less mappings remain compatible without automatic enrollment. No email or phone account linking; phone possession is not verified. Trusted provider email and literal boolean email_verified refresh separate notification contact fields atomically with the subject mapping, before profile acknowledgement. Missing or invalid email clears contact; missing, false or malformed verification clears verified status. Login credentials are unchanged.
      security: [{ServiceKey: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [access_token]
              properties:
                access_token:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  writeOnly: true
      responses:
        '200':
          description: New local opaque session; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/me:
    get:
      operationId: currentIdentity
      security: [{ServiceKey: [], BearerAuth: []}]
      responses:
        '200':
          description: Identity from the session, never from a client-supplied user ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the presented session; repeat requests with the same well-formed token are harmless.
      security: [{ServiceKey: [], BearerAuth: []}]
      responses:
        '204':
          description: Session removed, or already absent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
components:
  schemas:
    AuthorityEnrollmentRequest:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "issuer",
          "subject",
          "client_id",
          "provider_root_session_id",
          "provider_tab_id",
          "authentication_session_id",
          "command_id",
          "phone_number",
          "email"
        ],
        "properties": {
          "issuer": {
            "type": "string",
            "maxLength": 512
          },
          "subject": {
            "type": "string",
            "maxLength": 255
          },
          "client_id": {
            "type": "string",
            "maxLength": 128
          },
          "provider_root_session_id": {
            "type": "string",
            "maxLength": 255
          },
          "provider_tab_id": {
            "type": "string",
            "maxLength": 255
          },
          "authentication_session_id": {
            "type": "string",
            "maxLength": 43
          },
          "command_id": {
            "type": "string",
            "format": "uuid"
          },
          "phone_number": {
            "type": "string",
            "pattern": "^\\+9715[024568][0-9]{7}$"
          },
          "email": {
            "type": "string",
            "maxLength": 254
          }
        }
      }
    AuthorityStatusRequest:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "issuer",
          "subject",
          "client_id",
          "provider_root_session_id",
          "provider_tab_id",
          "authentication_session_id"
        ],
        "properties": {
          "issuer": {
            "type": "string",
            "maxLength": 512
          },
          "subject": {
            "type": "string",
            "maxLength": 255
          },
          "client_id": {
            "type": "string",
            "maxLength": 128
          },
          "provider_root_session_id": {
            "type": "string",
            "maxLength": 255
          },
          "provider_tab_id": {
            "type": "string",
            "maxLength": 255
          },
          "authentication_session_id": {
            "type": "string",
            "maxLength": 43
          }
        }
      }
    AuthorityChallengeRequest:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "issuer",
          "subject",
          "client_id",
          "provider_root_session_id",
          "provider_tab_id",
          "authentication_session_id",
          "command_id",
          "purpose",
          "contact_version"
        ],
        "properties": {
          "issuer": {
            "type": "string",
            "maxLength": 512
          },
          "subject": {
            "type": "string",
            "maxLength": 255
          },
          "client_id": {
            "type": "string",
            "maxLength": 128
          },
          "provider_root_session_id": {
            "type": "string",
            "maxLength": 255
          },
          "provider_tab_id": {
            "type": "string",
            "maxLength": 255
          },
          "authentication_session_id": {
            "type": "string",
            "maxLength": 43
          },
          "command_id": {
            "type": "string",
            "format": "uuid"
          },
          "purpose": {
            "type": "string",
            "enum": [
              "REGISTRATION_EMAIL",
              "REGISTRATION_PHONE"
            ]
          },
          "contact_version": {
            "type": "integer",
            "minimum": 1
          }
        }
      }
    AuthorityConsumeRequest:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "issuer",
          "subject",
          "client_id",
          "provider_root_session_id",
          "provider_tab_id",
          "authentication_session_id",
          "command_id",
          "purpose",
          "contact_version",
          "code"
        ],
        "properties": {
          "issuer": {
            "type": "string",
            "maxLength": 512
          },
          "subject": {
            "type": "string",
            "maxLength": 255
          },
          "client_id": {
            "type": "string",
            "maxLength": 128
          },
          "provider_root_session_id": {
            "type": "string",
            "maxLength": 255
          },
          "provider_tab_id": {
            "type": "string",
            "maxLength": 255
          },
          "authentication_session_id": {
            "type": "string",
            "maxLength": 43
          },
          "command_id": {
            "type": "string",
            "format": "uuid"
          },
          "purpose": {
            "type": "string",
            "enum": [
              "REGISTRATION_EMAIL",
              "REGISTRATION_PHONE"
            ]
          },
          "contact_version": {
            "type": "integer",
            "minimum": 1
          },
          "code": {
            "type": "string",
            "pattern": "^[0-9]{6}$"
          }
        }
      }
    AuthorityEnrollmentResponse:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "enrollment_id",
          "version",
          "state",
          "email_contact_version",
          "phone_contact_version",
          "email_verified",
          "phone_verified"
        ],
        "properties": {
          "enrollment_id": {
            "type": "string",
            "format": "uuid"
          },
          "version": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING_CONTACTS",
              "BLOCKED_MIGRATION",
              "PROJECTION_PENDING",
              "PROJECTED",
              "SUSPENDED"
            ]
          },
          "email_contact_version": {
            "type": "integer",
            "minimum": 1
          },
          "phone_contact_version": {
            "type": "integer",
            "minimum": 1
          },
          "email_verified": {
            "type": "boolean"
          },
          "phone_verified": {
            "type": "boolean"
          }
        }
      }
    AuthorityChallengeResponse:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "challenge_id",
          "state",
          "expires_at",
          "resend_at",
          "attempts_remaining"
        ],
        "properties": {
          "challenge_id": {
            "type": "string",
            "format": "uuid"
          },
          "state": {
            "type": "string",
            "enum": [
              "PENDING_DELIVERY"
            ]
          },
          "expires_at": {
            "type": "string",
            "format": "date-time"
          },
          "resend_at": {
            "type": "string",
            "format": "date-time"
          },
          "attempts_remaining": {
            "type": "integer",
            "minimum": 0,
            "maximum": 5
          }
        }
      }
    AuthorityConsumeResponse:
      {
        "type": "object",
        "additionalProperties": false,
        "required": [
          "receipt_id",
          "contact_version",
          "state"
        ],
        "properties": {
          "receipt_id": {
            "type": "string",
            "format": "uuid"
          },
          "contact_version": {
            "type": "integer",
            "minimum": 1
          },
          "state": {
            "type": "string",
            "enum": [
              "CONSUMED"
            ]
          }
        }
      }
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN]
    Identity:
      type: object
      required: [id, email]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          nullable: true
          description: Null for SSO identities; never used to link accounts.
          format: email
    Session:
      type: object
      required: [access_token, token_type, expires_in, expires_at]
      properties:
        access_token:
          type: string
          minLength: 43
          maxLength: 43
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          enum: [1800]
        expires_at:
          type: string
          format: date-time
    Registration:
      type: object
      additionalProperties: false
      required: [email, password, phone_number]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; ASCII email addresses only.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: At least 15 Unicode code points, at most 128 UTF-16 code units; never trimmed.
        phone_number:
          type: string
          pattern: '^\+9715[024568][0-9]{7}$'
          description: Exact canonical UAE mobile claim; immutable and unique across legacy and SSO identities. Does not attest possession.
    Credentials:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; ASCII email addresses only in this version.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: At least 15 Unicode code points, at most 128 UTF-16 code units; never trimmed.
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
  securitySchemes:
    VerificationBridge:
      {
        "type": "apiKey",
        "in": "header",
        "name": "X-ArMoney-SSO-Bridge-Key"
      }
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Opaque random session token
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
  requestBodies:
    Registration:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Registration'
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    BadRequest:
      description: Malformed JSON, invalid email, password or registration phone
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Generic registration_conflict; an email, phone or durable user-service claim conflicts. No account linking or credential replacement occurs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing service identity or invalid session/credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 4096 bytes (12288 for SSO exchange)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Attempt or concurrency limit reached; Retry-After specifies seconds
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
