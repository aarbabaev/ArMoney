components:
  schemas:
    MigrationUuid:
      type: string
      format: uuid
      minLength: 36
      maxLength: 36
      pattern: ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$
      not:
        enum:
        - 00000000-0000-0000-0000-000000000000
    MigrationDigest:
      type: string
      pattern: ^[0-9a-f]{64}$
      minLength: 64
      maxLength: 64
    MigrationCsrf:
      type: string
      pattern: ^[A-Za-z0-9_-]{43}$
      minLength: 43
      maxLength: 43
      writeOnly: true
      description: Original server-issued one-use CSRF value; never a caller-created authority claim.
    MigrationUserBefore:
      type: object
      additionalProperties: false
      required:
      - profile_id
      - shard_id
      - baseline_generation
      - contact_mutation_revision
      - projection_present
      - projection_revision
      - phone_contact_version
      - verification_epoch
      properties:
        profile_id:
          $ref: '#/components/schemas/MigrationUuid'
        shard_id:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,64}$
        baseline_generation:
          type: integer
          format: int64
          minimum: 0
        contact_mutation_revision:
          type: integer
          format: int64
          minimum: 0
        projection_present:
          type: boolean
        projection_revision:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        phone_contact_version:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          nullable: true
      description: Exact User8. All three projection fields are null when projection_present is false, and all are positive
        when true. Null whole object is allowed only for genuine initial REG bootstrap.
    MigrationUserBaseline:
      type: object
      additionalProperties: false
      required:
      - migration_id
      - decision_id
      - publication_revision
      - final_ack_hash
      properties:
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        decision_id:
          $ref: '#/components/schemas/MigrationUuid'
        publication_revision:
          type: integer
          format: int64
          minimum: 1
        final_ack_hash:
          $ref: '#/components/schemas/MigrationDigest'
    MigrationProjectionAfter:
      type: object
      additionalProperties: false
      required:
      - expected_version
      - version
      - phone_contact_version
      - verification_epoch
      - projection_payload_hash
      properties:
        expected_version:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483646
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        phone_contact_version:
          type: integer
          format: int32
          minimum: 1
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
        projection_payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
      description: Original Auth projection command only; version equals expected_version + 1. No caller source/epoch
        selection.
    MigrationMutationBinding:
      type: object
      additionalProperties: false
      required:
      - source_kind
      - migration_id
      - decision_id
      - classification_generation
      - previous_epoch
      - previous_source_revision
      - resulting_epoch
      - resulting_source_revision
      properties:
        source_kind:
          type: string
          enum:
          - MIG
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        decision_id:
          $ref: '#/components/schemas/MigrationUuid'
        classification_generation:
          type: integer
          format: int64
          minimum: 1
        previous_epoch:
          type: integer
          format: int64
          minimum: 1
        previous_source_revision:
          type: integer
          format: int64
          minimum: 1
        resulting_epoch:
          type: integer
          format: int64
          minimum: 1
        resulting_source_revision:
          type: integer
          format: int64
          minimum: 1
      description: Denial-only server-derived MIG binding. An already suspended new operation preserves the actual current
        epoch/revision; exact replay returns its original result.
    MigrationDecisionQuery:
      type: object
      additionalProperties: false
      required:
      - migration_id
      - stage_operation_id
      - command_id
      - payload_hash
      properties:
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        stage_operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        command_id:
          $ref: '#/components/schemas/MigrationUuid'
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
      description: Exact original publication tuple. command_id is the original publication command, not a new browser
        FINAL command.
    MigrationEvidenceQuery:
      type: object
      additionalProperties: false
      required:
      - migration_id
      - decision_id
      - stage_operation_id
      - command_id
      - payload_hash
      properties:
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        decision_id:
          $ref: '#/components/schemas/MigrationUuid'
        stage_operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        command_id:
          $ref: '#/components/schemas/MigrationUuid'
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
    MigrationDecision:
      type: object
      additionalProperties: false
      required:
      - decision_id
      - migration_id
      - stage_operation_id
      - payload_hash
      - state
      properties:
        decision_id:
          $ref: '#/components/schemas/MigrationUuid'
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        stage_operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
        state:
          type: string
          enum:
          - PUBLICATION_AUTHORIZED
          - COMPLETED
      description: COMPLETED is derived only from validated immutable Auth completion and provenance. This historical
        readback is not current eligibility or a banking/session grant.
    MigrationPublicationEvidence:
      type: object
      additionalProperties: false
      required:
      - protocol_version
      - migration_id
      - decision_id
      - stage_operation_id
      - identity_id
      - baseline_hash
      - stage_ack_hash
      - email_contact_version
      - email_digest
      - email_receipt_id
      - email_receipt_generation
      - phone_receipt_id
      - phone_receipt_generation
      - receipt_snapshot_hash
      - policy_version
      - payload_hash
      - state
      properties:
        protocol_version:
          type: integer
          enum:
          - 1
        migration_id:
          $ref: '#/components/schemas/MigrationUuid'
        decision_id:
          $ref: '#/components/schemas/MigrationUuid'
        stage_operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        identity_id:
          $ref: '#/components/schemas/MigrationUuid'
        baseline_hash:
          $ref: '#/components/schemas/MigrationDigest'
        stage_ack_hash:
          $ref: '#/components/schemas/MigrationDigest'
        email_contact_version:
          type: integer
          format: int64
          minimum: 1
        email_digest:
          $ref: '#/components/schemas/MigrationDigest'
        email_receipt_id:
          $ref: '#/components/schemas/MigrationUuid'
        email_receipt_generation:
          type: integer
          format: int64
          minimum: 1
        phone_receipt_id:
          $ref: '#/components/schemas/MigrationUuid'
        phone_receipt_generation:
          type: integer
          format: int64
          minimum: 1
        receipt_snapshot_hash:
          $ref: '#/components/schemas/MigrationDigest'
        policy_version:
          type: integer
          format: int64
          minimum: 1
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
        state:
          type: string
          enum:
          - PUBLICATION_AUTHORIZED
          - COMPLETED
      description: Exact retained publication evidence; independent EMAIL/PHONE receipt IDs differ. No current User
        observation, provider proof or banking authority is created by this read.
    MigrationUserMutationRequest:
      type: object
      additionalProperties: false
      required:
      - protocol_version
      - operation_id
      - identity_id
      - baseline
      - before
      - after
      - payload_hash
      properties:
        protocol_version:
          type: integer
          enum:
          - 1
        operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        identity_id:
          $ref: '#/components/schemas/MigrationUuid'
        baseline:
          type: object
          additionalProperties: false
          required:
          - migration_id
          - decision_id
          - publication_revision
          - final_ack_hash
          properties:
            migration_id:
              $ref: '#/components/schemas/MigrationUuid'
            decision_id:
              $ref: '#/components/schemas/MigrationUuid'
            publication_revision:
              type: integer
              format: int64
              minimum: 1
            final_ack_hash:
              $ref: '#/components/schemas/MigrationDigest'
          nullable: true
        before:
          type: object
          additionalProperties: false
          required:
          - profile_id
          - shard_id
          - baseline_generation
          - contact_mutation_revision
          - projection_present
          - projection_revision
          - phone_contact_version
          - verification_epoch
          properties:
            profile_id:
              $ref: '#/components/schemas/MigrationUuid'
            shard_id:
              type: string
              pattern: ^[A-Za-z0-9_-]{1,64}$
            baseline_generation:
              type: integer
              format: int64
              minimum: 0
            contact_mutation_revision:
              type: integer
              format: int64
              minimum: 0
            projection_present:
              type: boolean
            projection_revision:
              type: integer
              format: int64
              minimum: 1
              nullable: true
            phone_contact_version:
              type: integer
              format: int64
              minimum: 1
              nullable: true
            verification_epoch:
              type: integer
              format: int64
              minimum: 1
              nullable: true
          description: Exact User8. All three projection fields are null when projection_present is false, and all are
            positive when true. Null whole object is allowed only for genuine initial REG bootstrap.
          nullable: true
        after:
          $ref: '#/components/schemas/MigrationProjectionAfter'
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
      description: Exact seven fields. before:null requires baseline:null and expected_version:0. H(suspend-request)
        binds the configured purpose writer and original tuple; identity IDs are trusted peer bindings, not browser
        input. Fractions, exponent numbers, duplicate/missing/extra fields are rejected.
    MigrationUserMutationResponse:
      type: object
      additionalProperties: false
      required:
      - protocol_version
      - operation_id
      - identity_id
      - payload_hash
      - outcome
      - binding
      - recorded_at_us
      properties:
        protocol_version:
          type: integer
          enum:
          - 1
        operation_id:
          $ref: '#/components/schemas/MigrationUuid'
        identity_id:
          $ref: '#/components/schemas/MigrationUuid'
        payload_hash:
          $ref: '#/components/schemas/MigrationDigest'
        outcome:
          type: string
          enum:
          - NOT_MIG
          - SUSPENDED
        binding:
          type: object
          additionalProperties: false
          required:
          - source_kind
          - migration_id
          - decision_id
          - classification_generation
          - previous_epoch
          - previous_source_revision
          - resulting_epoch
          - resulting_source_revision
          properties:
            source_kind:
              type: string
              enum:
              - MIG
            migration_id:
              $ref: '#/components/schemas/MigrationUuid'
            decision_id:
              $ref: '#/components/schemas/MigrationUuid'
            classification_generation:
              type: integer
              format: int64
              minimum: 1
            previous_epoch:
              type: integer
              format: int64
              minimum: 1
            previous_source_revision:
              type: integer
              format: int64
              minimum: 1
            resulting_epoch:
              type: integer
              format: int64
              minimum: 1
            resulting_source_revision:
              type: integer
              format: int64
              minimum: 1
          description: Denial-only server-derived MIG binding. An already suspended new operation preserves the actual
            current epoch/revision; exact replay returns its original result.
          nullable: true
        recorded_at_us:
          type: integer
          format: int64
          minimum: 0
      description: NOT_MIG requires binding:null and conclusive permanent REG provenance; SUSPENDED requires the exact
        nonnull MIG binding. recorded_at_us is diagnostic, not freshness authority. No success is returned before durable
        receipt COMMIT.
    MigrationBoundForm:
      type: object
      additionalProperties: false
      required:
      - csrf
      - command_id
      properties:
        csrf:
          $ref: '#/components/schemas/MigrationCsrf'
        command_id:
