dependencies {
    implementation 'com.nimbusds:nimbus-jose-jwt:10.10'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.5'
    implementation 'org.bouncycastle:bcprov-jdk18on:1.83'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.20.1'
}
dependencies { testImplementation 'org.apache.groovy:groovy-json:4.0.29' }
dependencies { testImplementation 'org.flywaydb:flyway-core:11.13.2' }
// Process acceptance launches the actual AuthMain distribution, never a substitute server.
// Registration-readiness acceptance uses real isolated UserMain and SMS sandbox processes.
// Task-only fixture dependencies add no service classes to Auth's runtime or test classpath.
tasks.named('integrationTest') { dependsOn tasks.named('installDist'), ':user-service:installDist', ':sms-sandbox:installDist' }
