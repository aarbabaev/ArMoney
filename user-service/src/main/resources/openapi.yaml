  "/v1/internal/migrations/legacy/user-publication-result":
    post:
      operationId: "readLegacyMigrationPublication"
      description: "Private Auth-to-User migration port; never expose through public gateway ingress. Registered only when USER_MIGRATION_BASELINE_ENABLED=true (default false). Disabled routes use ordinary internal authentication and otherwise remain absent (404); missing ordinary authentication can return 401. Enabled exact POST uses only its dedicated writer credential, not ServiceKey or VerifiedIdentity. Strict JSON rejects duplicate/unknown fields, trailing tokens and noncanonical numeric tokens; raw request maximum is 12288 bytes. Not a public client API, Auth migration completion, provider ACTIVE status or banking-session grant. Read the retained final publication ACK for the exact owner/writer/command tuple. Missing ACK is unavailable, never inferred completion."
      security: [{"LegacyMigrationPublicationKey": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LegacyMigrationTuple"
      responses:
        '200':
          description: "Exact command acknowledged or retained replay; grants no banking authority"
          headers:
            Cache-Control:
