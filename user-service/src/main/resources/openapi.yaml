        '429':
          description: "Route admission/concurrency or stage storage capacity exhausted"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
            Retry-After:
              description: "Fixed retry hint; never release a reservation or rotate command IDs on timeout."
              schema:
                type: "string"
                enum: ["60"]
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '503':
          description: "Missing publication ACK, unknown decision, inconsistent state or peer/database unavailable"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
  "/v1/internal/migrations/legacy/user-resolve":
    post:
      operationId: "resolveLegacyMigrationBaseline"
      description: "Private Auth-to-User migration port; never expose through public gateway ingress. Registered only when USER_MIGRATION_BASELINE_ENABLED=true (default false). Disabled routes use ordinary internal authentication and otherwise remain absent (404); missing ordinary authentication can return 401. Enabled exact POST uses only its dedicated writer credential, not ServiceKey or VerifiedIdentity. Strict JSON rejects duplicate/unknown fields, trailing tokens and noncanonical numeric tokens; raw request maximum is 12288 bytes. Not a public client API, Auth migration completion, provider ACTIVE status or banking-session grant. Resolve only durable Auth PRIMARY ABORTED for an unpublished reservation or COMPLETED for one with a retained publication ACK. Unknown/missing/timeout decisions are unavailable, never implicit abort; records are retained."
      security: [{"LegacyMigrationPublicationKey": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LegacyMigrationTuple"
      responses:
        '200':
          description: "Exact command acknowledged or retained replay; grants no banking authority"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationResolution"
        '400':
          description: "Malformed, noncanonical, hash-mismatched or oversized request"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '401':
