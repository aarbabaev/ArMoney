          nullable: true
          description: "Explicit null if projection_present=false; positive observed value if true."
        email_contact_version:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        email_digest:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        baseline_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
