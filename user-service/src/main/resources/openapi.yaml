openapi: 3.0.3
info:
  title: user-service
  version: 0.1.0
  description: Private owner-scoped profiles and exact registered UAE phone lookup.
    Registration claims do not prove phone ownership. No SMS verification is performed.
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access primary and every configured profile shard
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/internal/verification-projections:
    post:
      operationId: projectVerificationPhone
      description: >-
        Private auth-to-user central projection. Requires literal true
        USER_VERIFICATION_PROJECTION_ENABLED; default false. When disabled,
        ordinary business authentication applies: valid X-Service-Key and
        X-Identity-Id reach an absent handler (404), otherwise 401. When enabled,
        this exact POST uses only the dedicated projection credential mapped to a
        server-configured writer, not ServiceKey or VerifiedIdentity. Never
        expose through public gateway ingress. Does not grant ACTIVE eligibility,
        create banking sessions, attest operator verification or activate notices.
        Strict JSON rejects duplicate/unknown fields, nulls and trailing tokens.
        Raw request maximum is 12288 bytes; oversized requests return 400.
        Revision CAS and strictly increasing epoch apply to new operations;
        same phone preserves contact version, replacement increases it.
        Retained exact replay returns its original ACK without state mutation.
      security:
      - VerificationProjectionKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerificationProjectionCommand'
      responses:
        '200':
          description: Projection committed or exact retained replay; ACK grants no banking authority
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionAck'
        '400':
          description: Malformed, noncanonical, hash-mismatched or oversized request
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
        '401':
          description: Missing, ambiguous or invalid dedicated credential
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
        '409':
          description: Payload, revision, epoch, contact-version or phone-ownership conflict
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
        '410':
          description: Operation retained only as expired tombstone; never resubmit under a new UUID automatically
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
        '429':
          description: Admission or retained-record/tombstone capacity exhausted
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
            Retry-After:
              schema:
                type: integer
                enum: [60]
              description: Conservative retry delay in seconds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
        '503':
          description: Storage unavailable or uncertain; retry identical operation
          headers:
            Cache-Control:
              $ref: '#/components/headers/ProjectionNoStore'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerificationProjectionError'
  /internal/registrations/me:
    put:
      operationId: registerPhone
      description: Auth-service supplies its verified identity and immutable registration phone. Identical retries are durable and idempotent. Claims and phone ownership are stored on the primary directory database. No profile or shard placement is fabricated. Existing profiles can bind only a missing or identical phone, preserving name and verification. Legacy profiles without a claim remain undiscoverable until explicit enrollment.
      security:
      - ServiceKey: []
        VerifiedIdentity: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [phone_number]
              properties:
                phone_number:
                  type: string
                  pattern: ^\+9715[024568][0-9]{7}$
      responses:
        '204':
          description: Durable matching registration claim
        '400':
          description: Invalid exact JSON or UAE mobile
        '401':
          description: Missing or invalid service key or verified identity
        '409':
          description: Phone already claimed or present on another legacy profile, or identity has a different phone
        '413':
          description: Request exceeds 4096 bytes
        '503':
          description: Database unavailable; retry the identical command
  /v1/users/me:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No profile yet
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
      security:
      - ServiceKey: []
        VerifiedIdentity: []
    put:
      operationId: saveProfile
      description: Create or update the current identity profile. Stable profile ID;
        last committed write wins. The primary directory binds the immutable registration phone when present. Optional gateway-verified X-Identity-Email selects
        the initial email-prefix shard; placement remains pinned. Missing email uses
        the configured default shard (primary by default). Client JSON cannot select a shard.
      parameters:
      - in: header
        name: X-Identity-Email
        required: false
        description: Gateway identity email; public client headers are discarded.
        schema:
          type: string
          format: email

      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed; nonblank; no control characters
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
      security:
      - ServiceKey: []
        VerifiedIdentity: []
  /v1/users/me/phone:
    put:
      operationId: changePhone
      security: &id001
      - ServiceKey: []
        VerifiedIdentity: []
      description: Requires an existing profile and registration claim. Only an identical registered phone retry is accepted; changes or missing claims return 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number: &id002
                  type: string
                  pattern: ^\+9715[024568][0-9]{7}$
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': &id003
          description: Invalid exact JSON or canonical UAE mobile value
        '401': &id004
          description: Missing service key or trusted identity
        '409':
          description: Immutable registration phone mismatch or no claim
        '404': &id005
          description: Profile or registered recipient not found
        '413': &id006
          description: Request exceeds 4096 bytes
        '503': &id007
          description: Database unavailable
  /v1/users/resolve-phone:
    post:
      operationId: resolveRegisteredPhone
      security: *id001
      description: Exact registered phone with a matching profile only; phone_verified is not required. Discloses recipient display name to
        authenticated callers. Database-backed limit of 30 lookups per requester per
        60 seconds includes misses. Lookup loads the pinned profile shard and fails closed if it is unavailable.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number: *id002
      responses:
        '200':
          description: Registered recipient (ownership unverified)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400': *id003
        '401': *id004
        '404': *id005
        '413': *id006
        '503': *id007
        '429':
          description: Requester lookup limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry (conservative 60)
  "/v1/internal/migrations/legacy/user-stage":
    post:
      operationId: "stageLegacyMigrationBaseline"
      description: "Private Auth-to-User migration port; never expose through public gateway ingress. Registered only when USER_MIGRATION_BASELINE_ENABLED=true (default false). Disabled routes use ordinary internal authentication and otherwise remain absent (404); missing ordinary authentication can return 401. Enabled exact POST uses only its dedicated writer credential, not ServiceKey or VerifiedIdentity. Strict JSON rejects duplicate/unknown fields, trailing tokens and noncanonical numeric tokens; raw request maximum is 12288 bytes. Not a public client API, Auth migration completion, provider ACTIVE status or banking-session grant. Stage an existing initialized profile and exact canonical central phone; allocate a new baseline generation, never fabricated projection history. Existing exact replay returns its original ACK. Authorization interval must be positive and at most 900000 milliseconds. Expiry never releases an unresolved reservation."
      security: [{"LegacyMigrationStageKey": []}]
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              "$ref": "#/components/schemas/LegacyMigrationStageCommand"
      responses:
        '200':
          description: "Exact command acknowledged or retained replay; grants no banking authority"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationStageAck"
        '400':
          description: "Malformed, noncanonical, hash-mismatched or oversized request"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '401':
          description: "Missing, duplicate or invalid dedicated purpose credential"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '409':
          description: "Stage baseline, writer, owner or immutable command binding conflict"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '429':
          description: "Route admission/concurrency or stage storage capacity exhausted"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
            Retry-After:
              description: "Fixed retry hint; never release a reservation or rotate command IDs on timeout."
              schema:
                type: "string"
                enum: ["60"]
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '503':
          description: "Missing publication ACK, unknown decision, inconsistent state or peer/database unavailable"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
        '423':
          description: "Protected contact baseline is reserved or a fenced mutation was rejected"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationError"
