          content:
            "application/json":
              schema:
                "$ref": "#/components/schemas/LegacyMigrationFinalAck"
        '400':
          description: "Malformed, noncanonical, hash-mismatched or oversized request"
          headers:
            Cache-Control:
              "$ref": "#/components/headers/ProjectionNoStore"
          content:
            "application/json":
