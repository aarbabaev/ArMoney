components:
  schemas:
    LiveUserCurrentCommand:
      type: object
      additionalProperties: false
      required: [protocol_version, operation_id, identity_id, migration_id, decision_id, classification_generation, auth_epoch, auth_source_revision, payload_hash]
      properties:
        protocol_version:
          type: integer
          format: int64
          enum: [1]
        operation_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        identity_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        migration_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        decision_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        classification_generation:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        auth_epoch:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        auth_source_revision:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        payload_hash:
          $ref: '#/components/schemas/LegacyMigrationDigest'
      description: >-
        Exactly nine fields. Auth derives the owner and source fields from its
        admitted current MIG authority; no public requester chooses them. Hash is
        H(current-request, writer_id then all preceding required fields in listed
        order), excluding payload_hash. H hashes ASCII ArMoney-LiveUser-v1 plus
        zero byte, frame(domain), then frame(field-name)+typed(value) for each
        named field. frame is unsigned32 big-endian UTF-8 length then bytes;
        typed string is byte1+frame, integer byte2+signed64 big-endian, null byte0,
        boolean byte3+byte0/1, object byte4+unsigned32 count+ordered named values.
        This flat request uses strings and integers only. writer_id is selected
        by purpose-key authentication and never supplied in JSON. JSON property
        order is irrelevant; canonical hash order is fixed. This does not replace
        the older armoney-user-migration-baseline-v1 length-prefixed text hash.
    LiveUserCurrentResponse:
      type: object
      additionalProperties: false
      required: [protocol_version, operation_id, identity_id, payload_hash, migration_id, decision_id, classification_generation, auth_epoch, auth_source_revision, status, current, observed_at_us]
      properties:
        protocol_version:
          type: integer
          format: int64
          enum: [1]
        operation_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        identity_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        payload_hash:
          $ref: '#/components/schemas/LegacyMigrationDigest'
        migration_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        decision_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        classification_generation:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        auth_epoch:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        auth_source_revision:
          $ref: '#/components/schemas/LegacyMigrationPositive'
        status:
          type: string
          enum: [CURRENT]
        current:
          $ref: '#/components/schemas/LiveUserCurrentTuple'
        observed_at_us:
          $ref: '#/components/schemas/LegacyMigrationNonnegative'
      description: >-
        Exactly twelve fields. All request correlation fields echo their original
        values. observed_at_us is integer Unix epoch microseconds from the User
        database read, for correlation only; it is not a freshness lease or expiry.
    LiveUserCurrentTuple:
      type: object
      additionalProperties: false
      required: [profile_id, shard_id, baseline_generation, contact_mutation_revision, projection_present, projection_revision, phone_contact_version, verification_epoch]
      properties:
        profile_id:
          $ref: '#/components/schemas/LegacyMigrationUuid'
        shard_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{1,64}$'
        baseline_generation:
          $ref: '#/components/schemas/LegacyMigrationNonnegative'
        contact_mutation_revision:
          $ref: '#/components/schemas/LegacyMigrationNonnegative'
        projection_present:
          type: boolean
        projection_revision:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
        phone_contact_version:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
      oneOf:
      - properties:
          projection_present: {type: boolean, enum: [false]}
          projection_revision: {type: integer, nullable: true, enum: [null]}
          phone_contact_version: {type: integer, nullable: true, enum: [null]}
          verification_epoch: {type: integer, nullable: true, enum: [null]}
      - properties:
          projection_present: {type: boolean, enum: [true]}
          projection_revision: {$ref: '#/components/schemas/LegacyMigrationPositive'}
          phone_contact_version: {$ref: '#/components/schemas/LegacyMigrationPositive'}
          verification_epoch: {$ref: '#/components/schemas/LegacyMigrationPositive'}
      description: >-
        Exact User8 tuple in listed order. Absent projection requires all three
        trailing values to be JSON null; never substitute zero or version one.
        Present projection requires three positive current values. Profile UUID
        is distinct from identity UUID and shard is immutable placement. Generation
        and contact revision are current User counters, not contact verification.
        Narrow V7 publication and completion release preserve the staged tuple;
        later protected mutations advance revision according to actual triggers,
        not an assumed increment of one. Historical ACKs remain immutable.
    LiveUserRejectedError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, enum: [rejected]}
    LiveUserConflictError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, enum: [conflict]}
    LiveUserUnavailableError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error: {type: string, enum: [unavailable]}
    LegacyMigrationUuid:
      type: "string"
      format: "uuid"
      pattern: "^(?!00000000-0000-0000-0000-000000000000$)[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
    LegacyMigrationDigest:
      type: "string"
      pattern: "^[0-9a-f]{64}$"
    LegacyMigrationPositive:
      type: "integer"
      format: "int64"
      minimum: 1
      maximum: 9223372036854775807
    LegacyMigrationNonnegative:
      type: "integer"
      format: "int64"
      minimum: 0
      maximum: 9223372036854775807
    LegacyMigrationStageCommand:
      type: "object"
      additionalProperties: false
      required: ["protocol_version", "migration_id", "stage_operation_id", "command_id", "decision_command_id", "identity_id", "profile_id", "canonical_phone", "email_contact_version", "email_digest", "policy_version", "created_at", "authorization_deadline", "payload_hash"]
      properties:
        protocol_version:
          type: "integer"
          enum: [1]
        migration_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        stage_operation_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        command_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        decision_command_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        identity_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        profile_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        canonical_phone:
          type: "string"
          pattern: "^\\+9715[024568][0-9]{7}$"
        email_contact_version:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        email_digest:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        policy_version:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        created_at:
          "$ref": "#/components/schemas/LegacyMigrationNonnegative"
        authorization_deadline:
          "$ref": "#/components/schemas/LegacyMigrationNonnegative"
        payload_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
      description: "protocol_version=1. Exact stage payload_hash uses SHA-256 over four-byte big-endian length-prefixed UTF-8 fields in the listed required-field order, excluding payload_hash, prefixed with armoney-user-migration-stage-v1. UUIDs and integers are canonical; timestamps are epoch milliseconds. authorization_deadline-created_at must be 1..900000. Email version/digest are opaque Auth attestations; no email address or name is accepted."
    LegacyMigrationTuple:
      type: "object"
      additionalProperties: false
      required: ["migration_id", "decision_id", "stage_operation_id", "command_id", "payload_hash"]
      properties:
        migration_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        decision_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        stage_operation_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        command_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        payload_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
      description: "payload_hash is the original stage payload hash. Publication command_id is stable and exact across publish/result/resolve; mismatch conflicts. No new owner/contact fields are accepted."
    LegacyMigrationStageAck:
      type: "object"
      additionalProperties: false
      required: ["protocol_version", "migration_id", "stage_operation_id", "identity_id", "profile_id", "baseline_generation", "contact_mutation_revision", "projection_present", "projection_revision", "phone_contact_version", "verification_epoch", "email_contact_version", "email_digest", "baseline_hash", "authorization_deadline", "payload_hash", "stage_ack_hash"]
      properties:
        protocol_version:
          type: "integer"
          enum: [1]
        migration_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        stage_operation_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        identity_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        profile_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        baseline_generation:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        contact_mutation_revision:
          "$ref": "#/components/schemas/LegacyMigrationNonnegative"
        projection_present:
          type: "boolean"
          description: "False means no current projection at stage; no positive historical version is invented."
        projection_revision:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
          description: "Explicit null if projection_present=false; positive observed value if true."
        phone_contact_version:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
          description: "Explicit null if projection_present=false; positive observed value if true."
        verification_epoch:
          type: "integer"
          format: "int64"
          minimum: 1
          maximum: 9223372036854775807
          nullable: true
          description: "Explicit null if projection_present=false; positive observed value if true."
        email_contact_version:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        email_digest:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        baseline_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        authorization_deadline:
          "$ref": "#/components/schemas/LegacyMigrationNonnegative"
        payload_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        stage_ack_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
      description: "Exact immutable baseline ACK. stage_ack_hash uses domain armoney-user-migration-stage-ack-v1 and listed required-field order excluding stage_ack_hash. Hash fields use length-prefixed UTF-8 canonical decimal/boolean/null encoding. baseline_hash also binds immutable local shard placement, exact central phone and policy; these are not returned as new authority fields. No raw phone or display name is returned."
      oneOf: [{"properties": {"projection_present": {"type": "boolean", "enum": [true]}, "projection_revision": {"type": "integer", "format": "int64", "minimum": 1, "maximum": 9223372036854775807, "nullable": false}, "phone_contact_version": {"type": "integer", "format": "int64", "minimum": 1, "maximum": 9223372036854775807, "nullable": false}, "verification_epoch": {"type": "integer", "format": "int64", "minimum": 1, "maximum": 9223372036854775807, "nullable": false}}}, {"properties": {"projection_present": {"type": "boolean", "enum": [false]}, "projection_revision": {"type": "integer", "nullable": true, "enum": [null]}, "phone_contact_version": {"type": "integer", "nullable": true, "enum": [null]}, "verification_epoch": {"type": "integer", "nullable": true, "enum": [null]}}}]
    LegacyMigrationFinalAck:
      type: "object"
      additionalProperties: false
      required: ["protocol_version", "migration_id", "decision_id", "stage_operation_id", "command_id", "identity_id", "profile_id", "baseline_generation", "contact_mutation_revision", "baseline_hash", "stage_ack_hash", "publication_revision", "email_contact_version", "email_receipt_id", "email_receipt_generation", "phone_receipt_id", "phone_receipt_generation", "receipt_snapshot_hash", "payload_hash", "final_ack_hash"]
      properties:
        protocol_version:
          type: "integer"
          enum: [1]
        migration_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        decision_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        stage_operation_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        command_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        identity_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        profile_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        baseline_generation:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        contact_mutation_revision:
          "$ref": "#/components/schemas/LegacyMigrationNonnegative"
        baseline_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        stage_ack_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        publication_revision:
          type: "integer"
          format: "int64"
          enum: [1]
          description: "Per-migration publication revision; unchanged on retained replay."
        email_contact_version:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        email_receipt_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        email_receipt_generation:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        phone_receipt_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        phone_receipt_generation:
          "$ref": "#/components/schemas/LegacyMigrationPositive"
        receipt_snapshot_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        payload_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
        final_ack_hash:
          "$ref": "#/components/schemas/LegacyMigrationDigest"
      description: "Immutable migration publication evidence, not a normal verification-projection ACK or Auth migration completion. final_ack_hash uses domain armoney-user-migration-final-ack-v1 and listed required-field order excluding final_ack_hash. Receipt IDs/generations and receipt_snapshot_hash bind the immutable Auth publication decision; Auth owns email authority. No raw contacts, names or OTPs are returned."
    LegacyMigrationResolution:
      type: "object"
      additionalProperties: false
      required: ["migration_id", "decision_id", "state"]
      properties:
        migration_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        decision_id:
          "$ref": "#/components/schemas/LegacyMigrationUuid"
        state:
          type: "string"
          enum: ["ABORTED", "RELEASED_AFTER_COMPLETION"]
    LegacyMigrationError:
      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["malformed", "rejected", "unavailable"]
    VerificationProjectionCommand:
      type: object
      additionalProperties: false
      required: [operation_id, identity_id, expected_version, version, canonical_phone, phone_contact_version, verification_epoch, payload_hash]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        identity_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        expected_version:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483646
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Independent projection revision; must equal expected_version plus one.
        canonical_phone:
          type: string
          pattern: '^\+9715[024568][0-9]{7}$'
        phone_contact_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase SHA-256 over four-byte unsigned big-endian UTF-8
            length-prefixed fields in order: armoney-verification-projection-v1,
            operation_id, identity_id, expected_version, version, canonical_phone,
            phone_contact_version, verification_epoch. Canonical lowercase UUIDs
            and decimal integers without leading zeros; exclude payload_hash.
    VerificationProjectionAck:
      type: object
      additionalProperties: false
      required: [operation_id, identity_id, version, phone_contact_version, verification_epoch, payload_hash]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        identity_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        phone_contact_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    VerificationProjectionError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Profile:
      type: object
      required:
      - id
      - identity_id
      - display_name
      - phone_number
      - phone_verified
      properties:
        id:
          type: string
          format: uuid
        identity_id: &id008
          type: string
          format: uuid
        display_name: &id009
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          nullable: true
        phone_verified:
          type: boolean
    Recipient:
      type: object
      required:
      - identity_id
      - display_name
      - phone_number
      properties:
        identity_id: *id008
        display_name: *id009
        phone_number: *id002
  headers:
    ProjectionNoStore:
      schema:
        type: string
        enum: [no-store]
  securitySchemes:
    LiveUserCurrentKey:
      type: apiKey
      in: header
      name: X-ArMoney-Migration-User-Current-Key
      description: Dedicated Auth-to-User current-read credential mapped to a configured writer; exactly one header, independent of projection/publication/service keys. Default-off live routes only.
    LegacyMigrationStageKey:
      type: "apiKey"
      in: "header"
      name: "X-ArMoney-Migration-Stage-Key"
      description: "Private dedicated stage credential mapped to a configured Auth writer; default-off routes only."
    LegacyMigrationPublicationKey:
      type: "apiKey"
      in: "header"
      name: "X-ArMoney-Migration-Publication-Key"
      description: "Independent private publication/result/resolve credential mapped to a configured Auth writer; never a bank token."
    VerificationProjectionKey:
      type: apiKey
      in: header
      name: X-ArMoney-Verification-Projection-Key
      description: Independently provisioned auth-to-user credential; server maps it to an allowlisted writer.
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    VerifiedIdentity:
      type: apiKey
      in: header
      name: X-Identity-Id
      description: Gateway-verified auth identity UUID
