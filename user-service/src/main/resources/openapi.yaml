      type: "object"
      additionalProperties: false
      required: ["error"]
      properties:
        error:
          type: "string"
          enum: ["malformed", "rejected", "unavailable"]
    VerificationProjectionCommand:
      type: object
      additionalProperties: false
      required: [operation_id, identity_id, expected_version, version, canonical_phone, phone_contact_version, verification_epoch, payload_hash]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        identity_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        expected_version:
          type: integer
          format: int32
          minimum: 0
          maximum: 2147483646
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
          description: Independent projection revision; must equal expected_version plus one.
        canonical_phone:
          type: string
          pattern: '^\+9715[024568][0-9]{7}$'
        phone_contact_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
          description: >-
            Lowercase SHA-256 over four-byte unsigned big-endian UTF-8
            length-prefixed fields in order: armoney-verification-projection-v1,
            operation_id, identity_id, expected_version, version, canonical_phone,
            phone_contact_version, verification_epoch. Canonical lowercase UUIDs
            and decimal integers without leading zeros; exclude payload_hash.
    VerificationProjectionAck:
      type: object
      additionalProperties: false
      required: [operation_id, identity_id, version, phone_contact_version, verification_epoch, payload_hash]
      properties:
        operation_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        identity_id:
          type: string
          format: uuid
          pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$'
        version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        phone_contact_version:
          type: integer
          format: int32
          minimum: 1
          maximum: 2147483647
        verification_epoch:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
        payload_hash:
          type: string
          pattern: '^[0-9a-f]{64}$'
    VerificationProjectionError:
      type: object
      additionalProperties: false
      required: [error]
      properties:
        error:
          type: string
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Profile:
      type: object
      required:
      - id
      - identity_id
      - display_name
      - phone_number
      - phone_verified
      properties:
        id:
          type: string
          format: uuid
        identity_id: &id008
          type: string
          format: uuid
        display_name: &id009
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          nullable: true
        phone_verified:
          type: boolean
    Recipient:
      type: object
      required:
      - identity_id
      - display_name
      - phone_number
      properties:
        identity_id: *id008
        display_name: *id009
        phone_number: *id002
  headers:
    ProjectionNoStore:
      schema:
        type: string
        enum: [no-store]
  securitySchemes:
    LegacyMigrationStageKey:
      type: "apiKey"
      in: "header"
      name: "X-ArMoney-Migration-Stage-Key"
      description: "Private dedicated stage credential mapped to a configured Auth writer; default-off routes only."
    LegacyMigrationPublicationKey:
      type: "apiKey"
      in: "header"
      name: "X-ArMoney-Migration-Publication-Key"
      description: "Independent private publication/result/resolve credential mapped to a configured Auth writer; never a bank token."
    VerificationProjectionKey:
      type: apiKey
      in: header
      name: X-ArMoney-Verification-Projection-Key
      description: Independently provisioned auth-to-user credential; server maps it to an allowlisted writer.
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    VerifiedIdentity:
      type: apiKey
      in: header
      name: X-Identity-Id
      description: Gateway-verified auth identity UUID
