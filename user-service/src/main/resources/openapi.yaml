openapi: 3.0.3
info:
  title: user-service
  version: 0.1.0
  description: Private owner-scoped profiles and exact verified-phone recipient lookup.
    Verification is an explicit operator action, not SMS verification.
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access its database (gateway has no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/users/me:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No profile yet
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
      security:
      - ServiceKey: []
        VerifiedIdentity: []
    put:
      operationId: saveProfile
      description: Create or update the current identity profile. Stable profile ID;
        last committed write wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed; nonblank; no control characters
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
      security:
      - ServiceKey: []
        VerifiedIdentity: []
  /v1/users/me/phone:
    put:
      operationId: changePhone
      security: &id001
      - ServiceKey: []
        VerifiedIdentity: []
      description: Requires an existing profile. Changing the phone clears verification;
        repeating it preserves verification. No verification endpoint exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number: &id002
                  type: string
                  pattern: ^\+[1-9][0-9]{7,14}$
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400': &id003
          description: Invalid exact JSON or canonical E.164 value
        '401': &id004
          description: Missing service key or trusted identity
        '404': &id005
          description: Profile or verified recipient not found
        '413': &id006
          description: Request exceeds 4096 bytes
        '503': &id007
          description: Database unavailable
  /v1/users/resolve-phone:
    post:
      operationId: resolveVerifiedPhone
      security: *id001
      description: Exact verified phone only. Discloses recipient display name to
        authenticated callers. Database-backed limit of 30 lookups per requester per
        60 seconds includes misses.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number: *id002
      responses:
        '200':
          description: Verified recipient
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400': *id003
        '401': *id004
        '404': *id005
        '413': *id006
        '503': *id007
        '429':
          description: Requester lookup limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry (conservative 60)
components:
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Profile:
      type: object
      required:
      - id
      - identity_id
      - display_name
      - phone_number
      - phone_verified
      properties:
        id:
          type: string
          format: uuid
        identity_id: &id008
          type: string
          format: uuid
        display_name: &id009
          type: string
          minLength: 1
          maxLength: 100
        phone_number:
          type: string
          pattern: ^\+[1-9][0-9]{7,14}$
          nullable: true
        phone_verified:
          type: boolean
    Recipient:
      type: object
      required:
      - identity_id
      - display_name
      - phone_number
      properties:
        identity_id: *id008
        display_name: *id009
        phone_number: *id002
  securitySchemes:
    ServiceKey:
      type: apiKey
      in: header
      name: X-Service-Key
    VerifiedIdentity:
      type: apiKey
      in: header
      name: X-Identity-Id
      description: Gateway-verified auth identity UUID
