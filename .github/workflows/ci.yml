name: CI
on:
  pull_request:
    branches: [main, bootstrap/m1-p2p-backend]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  INTERNAL_AUTH_KEY: ci-only-service-key-at-least-32-characters
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Compile, Spock, ArchUnit and PostgreSQL Testcontainers
        run: ./gradlew --no-daemon clean check installDist
      - name: Validate Compose
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - name: Build and smoke-test all service containers
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: |
          docker compose up --build -d
          python3 scripts/smoke.py
          python3 scripts/auth-smoke.py
          python3 scripts/onboarding-smoke.py
          python3 scripts/provisioning-smoke.py
          python3 scripts/ledger-smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
