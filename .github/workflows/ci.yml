          if [[ "$SELECTED" == true ]]; then
            echo 'android: affected checks requested.' >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$SELECTED" == false ]]; then
            echo 'android: not affected; no component build or tests executed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Missing selection output' >&2; exit 1
          fi
