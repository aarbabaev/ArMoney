name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [bootstrap/m1-p2p-backend, main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile, Spock, ArchUnit and PostgreSQL Testcontainers
        run: ./gradlew --no-daemon clean check installDist
      - name: Validate Compose
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - name: Build and smoke-test all service containers
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: |
          docker compose up --build -d
          python3 scripts/smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
