name: CI
on:
  pull_request:
    branches: [main, bootstrap/m1-p2p-backend]
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  INTERNAL_AUTH_KEY: ci-only-service-key-at-least-32-characters
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - name: Compile, Spock, ArchUnit and PostgreSQL Testcontainers
        run: ./gradlew --no-daemon clean check installDist
      - name: Validate Compose
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - name: Build and smoke-test all service containers
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: |
          docker compose up --build -d
          python3 scripts/smoke.py
          python3 scripts/auth-smoke.py
          python3 scripts/onboarding-smoke.py
          python3 scripts/provisioning-smoke.py
          python3 scripts/ledger-smoke.py
          python3 scripts/p2p-smoke.py
      - name: Container diagnostics
        if: failure()
        run: docker compose logs --no-color
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - name: Browser SSO against disposable Keycloak and HTTPS edge
        env:
          COMPOSE_FILE: compose.yaml:compose.sso.yaml:compose.sso-ci.yaml
          LOCAL_DB_PASSWORD: ci-only-password
          SSO_DB_PASSWORD: ci-only-keycloak-database-password
          SSO_ADMIN_PASSWORD: ci-only-keycloak-admin-password
          SSO_CLIENT_SECRET: ci-only-introspection-client-secret-32-chars
          SSO_CA_FILE: /tmp/armoney-ci-root.crt
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          docker compose up -d
          for i in $(seq 1 60); do
            if docker compose cp edge:/data/caddy/pki/authorities/local/root.crt "$SSO_CA_FILE"; then break; fi
            sleep 2
          done
          python3 scripts/sso-smoke.py
      - name: SSO diagnostics and cleanup
        if: always()
        env:
          COMPOSE_FILE: compose.yaml:compose.sso.yaml:compose.sso-ci.yaml
          LOCAL_DB_PASSWORD: ci-only-password
          SSO_DB_PASSWORD: ci-only-keycloak-database-password
          SSO_ADMIN_PASSWORD: ci-only-keycloak-admin-password
          SSO_CLIENT_SECRET: ci-only-introspection-client-secret-32-chars
        run: |
          docker compose logs --no-color --tail=100 sso-service edge
          docker compose down --volumes
      - name: Stop containers
        if: always()
        run: docker compose down --volumes
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: test-reports
          path: '**/build/reports/tests/'
  ios:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Native Swift build and simulator tests
        run: bash scripts/test-ios.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install pinned Android SDK packages
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Kotlin tests, lint and debug APK
        run: ./gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Real Keystore and native screen tests
        uses: ReactiveCircus/android-emulator-runner@1dcd0090116d15e7c562f8db72807de5e036a4ed # v2.34.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: ./gradlew -p android --no-daemon connectedDebugAndroidTest
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: android-debug-and-reports
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/reports/
