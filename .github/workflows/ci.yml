name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  INTERNAL_AUTH_KEY: ci-only-service-key-at-least-32-characters
jobs:
  build:
    # GitHub all_external_contributors approval policy is the external-run gate.
    if: github.actor == 'aarbabaev' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, armoney-local]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify local toolchain and isolated daemon
        id: isolation
        run: |
          python3 scripts/test-local-ci-guards.py
          bash scripts/check-local-ci.sh
      - name: Compile, Spock, ArchUnit and PostgreSQL Testcontainers
        run: ./gradlew --no-daemon clean check installDist
      - name: Validate Compose
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: docker compose config --quiet
      - name: Build and smoke-test all service containers
        env:
          LOCAL_DB_PASSWORD: ci-only-password
        run: |
          docker compose up --build -d
          python3 scripts/smoke.py
          python3 scripts/auth-smoke.py
          python3 scripts/onboarding-smoke.py
          python3 scripts/provisioning-smoke.py
          python3 scripts/ledger-smoke.py
          python3 scripts/p2p-smoke.py
      - name: Container diagnostics
        if: failure() && steps.isolation.outcome == 'success'
        run: docker compose logs --no-color
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - name: Isolated user-profile sharding acceptance
        env:
          LOCAL_DB_PASSWORD: ci-only-shard-password
        run: |
          docker compose -p armoney-shards-test-ci -f compose.yaml -f compose.users-sharding.yaml -f compose.users-sharding-smoke.yaml up --build -d
          python3 scripts/users-sharding-smoke.py --project armoney-shards-test-ci
      - name: Sharding diagnostics and cleanup
        if: always() && steps.isolation.outcome == 'success'
        env:
          LOCAL_DB_PASSWORD: ci-only-shard-password
        run: |
          docker compose -p armoney-shards-test-ci -f compose.yaml -f compose.users-sharding.yaml -f compose.users-sharding-smoke.yaml logs --no-color --tail=80
          docker compose -p armoney-shards-test-ci -f compose.yaml -f compose.users-sharding.yaml -f compose.users-sharding-smoke.yaml down --volumes
      - name: Isolated ledger physical replication acceptance
        run: python3 scripts/ledger-replication-smoke.py
      - name: Browser SSO against disposable Keycloak and HTTPS edge
        env:
          COMPOSE_FILE: compose.yaml:compose.sso.yaml:compose.sso-ci.yaml
          LOCAL_DB_PASSWORD: ci-only-password
          SSO_DB_PASSWORD: ci-only-keycloak-database-password
          SSO_ADMIN_PASSWORD: ci-only-keycloak-admin-password
          SSO_CLIENT_SECRET: ci-only-introspection-client-secret-32-chars
          SSO_CA_FILE: /tmp/armoney-ci-root.crt
        run: |
          python3 -m pip install playwright==1.55.0
          python3 -m playwright install --with-deps chromium
          docker compose up -d
          for i in $(seq 1 60); do
            if docker compose cp edge:/data/caddy/pki/authorities/local/root.crt "$SSO_CA_FILE"; then break; fi
            sleep 2
          done
          python3 scripts/sso-smoke.py
      - name: SSO diagnostics and cleanup
        if: always() && steps.isolation.outcome == 'success'
        env:
          COMPOSE_FILE: compose.yaml:compose.sso.yaml:compose.sso-ci.yaml
          LOCAL_DB_PASSWORD: ci-only-password
          SSO_DB_PASSWORD: ci-only-keycloak-database-password
          SSO_ADMIN_PASSWORD: ci-only-keycloak-admin-password
          SSO_CLIENT_SECRET: ci-only-introspection-client-secret-32-chars
        run: |
          docker compose logs --no-color --tail=100 sso-service edge
          docker compose down --volumes
      - name: Stop containers
        if: always() && steps.isolation.outcome == 'success'
        run: docker compose down --volumes
        env:
          LOCAL_DB_PASSWORD: ci-only-password
      - name: Save backend reports locally
        if: always()
        run: bash scripts/archive-local-ci.sh backend
  android:
    # GitHub all_external_contributors approval policy is the external-run gate.
    if: github.actor == 'aarbabaev' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, linux, x64, armoney-local]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Verify local toolchain and isolated daemon
        id: isolation
        run: |
          python3 scripts/test-local-ci-guards.py
          bash scripts/check-local-ci.sh
      - name: Kotlin tests, lint and debug APK
        run: ./gradlew -p android --no-daemon testDebugUnitTest lintDebug assembleDebug
      - name: Real Keystore and native screen tests (software emulator)
        run: bash scripts/local-ci-android.sh
      - name: Save Android APK and reports locally
        if: always()
        run: bash scripts/archive-local-ci.sh android
