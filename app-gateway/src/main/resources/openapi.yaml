openapi: 3.0.3
info:
  title: app-gateway
  version: 0.1.0
  description: Operational API and authenticated profile/wallet metadata. No balances
    or transfers.
paths:
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access its database (gateway has no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/auth/register:
    post:
      operationId: register
      description: Registers an identity; duplicates return the same response without
        changing the password.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '202':
          description: Registration processed (also returned for an existing email)
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    enum:
                    - registration_processed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: New 30-minute opaque session; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/me:
    get:
      operationId: currentIdentity
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Identity from the session, never from a client-supplied user
            ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the presented session; repeat requests with the same well-formed
        token are harmless.
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Session removed, or already absent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/me:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current identity profile
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - identity_id
                - display_name
                properties:
                  id:
                    type: string
                    format: uuid
                  identity_id:
                    type: string
                    format: uuid
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 100
        '404':
          description: No profile yet
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: Gateway concurrency limit
          headers:
            Retry-After:
              schema:
                type: integer
      security:
      - BearerAuth: []
    put:
      operationId: saveProfile
      description: Create or update the current identity profile. Stable profile ID;
        last committed write wins.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed; nonblank; no control characters
      responses:
        '200':
          description: Saved profile
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - identity_id
                - display_name
                properties:
                  id:
                    type: string
                    format: uuid
                  identity_id:
                    type: string
                    format: uuid
                  display_name:
                    type: string
                    minLength: 1
                    maxLength: 100
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: Gateway concurrency limit
          headers:
            Retry-After:
              schema:
                type: integer
      security:
      - BearerAuth: []
  /v1/wallets:
    get:
      operationId: listWallets
      responses:
        '200':
          description: Only current identity wallets, sorted by currency
          content:
            application/json:
              schema:
                type: object
                required:
                - wallets
                properties:
                  wallets:
                    type: array
                    items:
                      type: object
                      required:
                      - id
                      - owner_id
                      - currency
                      - status
                      properties:
                        id:
                          type: string
                          format: uuid
                        owner_id:
                          type: string
                          format: uuid
                        currency:
                          type: string
                          enum:
                          - EUR
                          - USD
                          - GBP
                        status:
                          type: string
                          enum:
                          - ACTIVE
                          - CLOSED
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: Gateway concurrency limit
          headers:
            Retry-After:
              schema:
                type: integer
      security:
      - BearerAuth: []
    post:
      operationId: openWallet
      description: Returns a new or existing wallet for this owner and currency. Retrying
        never creates duplicates or reopens a closed wallet. Metadata only; no balance
        or ledger account provisioned.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currency
              properties:
                currency:
                  type: string
                  enum:
                  - EUR
                  - USD
                  - GBP
      responses:
        '200':
          description: New or existing wallet
          content:
            application/json:
              schema:
                type: object
                required:
                - id
                - owner_id
                - currency
                - status
                properties:
                  id:
                    type: string
                    format: uuid
                  owner_id:
                    type: string
                    format: uuid
                  currency:
                    type: string
                    enum:
                    - EUR
                    - USD
                    - GBP
                  status:
                    type: string
                    enum:
                    - ACTIVE
                    - CLOSED
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: Gateway concurrency limit
          headers:
            Retry-After:
              schema:
                type: integer
      security:
      - BearerAuth: []
components:
  schemas:
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
          - DOWN
    Identity:
      type: object
      required:
      - id
      - email
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
    Session:
      type: object
      required:
      - access_token
      - token_type
      - expires_in
      - expires_at
      properties:
        access_token:
          type: string
          minLength: 43
          maxLength: 43
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          enum:
          - 1800
        expires_at:
          type: string
          format: date-time
    Credentials:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and lowercased; ASCII email addresses only in this
            version.
        password:
          type: string
          format: password
          writeOnly: true
          minLength: 15
          maxLength: 128
          description: At least 15 Unicode code points, at most 128 UTF-16 code units;
            never trimmed.
    Error:
      type: object
      required:
      - error
      properties:
        error:
          type: string
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  requestBodies:
    Credentials:
      required: true
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Credentials'
  responses:
    BadRequest:
      description: Malformed JSON, invalid email or password
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing service identity or invalid session/credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooLarge:
      description: Request body exceeds 4096 bytes
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    RateLimited:
      description: Attempt or concurrency limit reached; Retry-After specifies seconds
      headers:
        Retry-After:
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Authentication dependency unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

