openapi: 3.0.3
info:
  title: app-gateway
  version: 0.2.0
  description: 'Public ArMoney API: authentication, profiles, phone recipients, wallets
    and balances, durable P2P and in-app notifications.'
paths:
  /v1/assistant/messages:
    post:
      operationId: assistantMessage
      security:
      - BearerAuth: []
      description: Stateless read-only assistant turn. Revalidates the session before
        execution, on each delegated read and before returning. No transfers or server
        conversation history. Financial facts come from verified owner-scoped reads;
        history is limited to the latest visible page of 50 payments. Policy citations
        refer to versioned local documents. Total gateway deadline is 35 seconds.
        Admission is limited to 10 turns per minute per verified owner and four
        concurrent turns. Quotas are in-memory and reset on gateway restart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message:
                  type: string
                  minLength: 1
                  maxLength: 2000
                  description: Nonblank Unicode text. Entire request is limited to 4096 UTF-8 bytes.
      responses:
        '200':
          description: Validated assistant reply; never financial command acceptance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssistantReply'
        '400':
          description: Invalid content type, exact JSON object or message bounds
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Assistant disabled, unavailable, malformed or timed out; authentication or read dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /v1/auth/sso:
    post:
      operationId: exchangeSsoToken
      description: Complete bank enrollment from a verified Keycloak access token
        and immutable UAE phone claim. The phone is unique across legacy and SSO bank
        identities. Never link accounts by email or phone; a conflicting provider
        account cannot obtain a bank session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - access_token
              properties:
                access_token:
                  type: string
                  minLength: 1
                  maxLength: 8192
                  writeOnly: true
      responses:
        '200':
          description: Local opaque session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          description: Invalid request
        '401':
          description: Invalid or expired provider access token
        '413':
          description: Body exceeds 12288 bytes
        '429':
          description: Attempt or concurrency limit
        '503':
          description: SSO disabled or unavailable
        '409':
          description: Registration phone is unavailable or conflicts with the existing
            binding
  /health/live:
    get:
      operationId: liveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /health/ready:
    get:
      operationId: readiness
      responses:
        '200':
          description: Service can access its database (gateway has no database)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /openapi.yaml:
    get:
      operationId: openApi
      responses:
        '200':
          description: This API contract
          content:
            application/yaml:
              schema:
                type: string
  /v1/auth/register:
    post:
      operationId: register
      description: Register with an immutable, globally unique UAE mobile number.
        Existing email retries never change credentials or phone. A number is a claim,
        not proof of ownership.
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Registration'
      responses:
        '202':
          description: Registration processed (also returned for an existing email)
          content:
            application/json:
              schema:
                type: object
                required:
                - message
                properties:
                  message:
                    type: string
                    enum:
                    - registration_processed
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Registration phone is unavailable or conflicts with the existing
            binding
  /v1/auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        $ref: '#/components/requestBodies/Credentials'
      responses:
        '200':
          description: New 30-minute opaque session; Cache-Control no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
        '409':
          description: Registration phone is unavailable or conflicts with the existing
            binding
  /v1/auth/me:
    get:
      operationId: currentIdentity
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Identity from the session, never from a client-supplied user
            ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Identity'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      operationId: logout
      description: Revokes the presented session; repeat requests with the same well-formed
        token are harmless.
      security:
      - BearerAuth: []
      responses:
        '204':
          description: Session removed, or already absent
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          $ref: '#/components/responses/TooLarge'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/users/me:
    get:
      operationId: getProfile
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '404':
          description: No profile yet
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      security:
      - BearerAuth: []
      parameters: []
    put:
      operationId: saveProfile
      description: Create or update the current identity profile. Stable profile ID;
        last committed write wins. Gateway derives optional profile email metadata
        from the revalidated session identity; client identity headers are ignored.
        Malformed authentication identity metadata returns 503. Email is omitted
        for identities without an email, including SSO identities.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - display_name
              properties:
                display_name:
                  type: string
                  minLength: 1
                  maxLength: 100
                  description: Trimmed; nonblank; no control characters
      responses:
        '200':
          description: Current profile; display-name updates preserve phone state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Dependency unavailable
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      security:
      - BearerAuth: []
      parameters: []
  /v1/wallets:
    get:
      operationId: listWallets
      security:
      - BearerAuth: []
      responses:
        '200':
          description: Current identity wallets including provisioning state, sorted
            by currency
          content:
            application/json:
              schema:
                type: object
                required:
                - wallets
                properties:
                  wallets:
                    type: array
                    items:
                      $ref: '#/components/schemas/Wallet'
        '401':
          description: Missing or invalid identity
        '503':
          description: Wallet database unavailable
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      parameters: []
    post:
      operationId: openWallet
      description: Creates durable provisioning intent and returns immediately. ACTIVE
        PENDING returns 202; READY or existing CLOSED returns 200. Poll GET for readiness.
        Retries preserve wallet identity and never reopen CLOSED wallets. A background
        worker retries ledger with the stable wallet ID. Ledger outage leaves PENDING.
        Existing ACTIVE wallets are reconciled after migration. No balances are held
        in wallet-service.
      security:
      - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - currency
              properties:
                currency:
                  type: string
                  enum:
                  - AED
      responses:
        '200':
          description: Confirmed READY wallet or existing CLOSED wallet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '202':
          description: ACTIVE wallet with durable PENDING ledger provisioning
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Wallet'
        '400':
          description: Invalid JSON or field values
        '401':
          description: Missing or invalid identity
        '413':
          description: Body exceeds 4096 bytes
        '503':
          description: Wallet database unavailable
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      parameters: []
  /v1/users/me/phone:
    put:
      operationId: changePhone
      security:
      - BearerAuth: []
      description: Identical retry of the immutable registration number only. Requires
        an existing profile and registered claim; changes or absent registration claims
        return 409. Does not verify ownership.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number:
                  type: string
                  pattern: ^\+9715[024568][0-9]{7}$
                  example: '+971501234567'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Profile'
        '400':
          description: Invalid exact JSON or canonical UAE mobile value
        '401':
          description: Missing service key or trusted identity
        '404':
          description: Profile or registered recipient not found
        '413':
          description: Request exceeds 4096 bytes
        '503':
          description: Database unavailable
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
        '409':
          description: Immutable registered number cannot be changed or is not enrolled
      parameters: []
  /v1/recipients/resolve:
    post:
      operationId: resolveVerifiedPhone
      security:
      - BearerAuth: []
      description: Exact registered UAE phone lookup. Requires a profile and registration
        binding, but no SMS or operator verification. Reveals only the recipient display
        name and bank identity; bounded per-requester lookup quota applies.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - phone_number
              properties:
                phone_number:
                  type: string
                  pattern: ^\+9715[024568][0-9]{7}$
                  example: '+971501234567'
      responses:
        '200':
          description: Registered UAE recipient; ownership verification is not required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Recipient'
        '400':
          description: Invalid exact JSON or canonical UAE mobile value
        '401':
          description: Missing service key or trusted identity
        '404':
          description: Profile or registered recipient not found
        '413':
          description: Request exceeds 4096 bytes
        '503':
          description: Database unavailable
        '429':
          description: Requester lookup limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds until retry (conservative 60)
      parameters: []
  /v1/wallets/{id}/balance:
    get:
      operationId: walletBalance
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      description: Owner-only live ledger balance. Validates account, wallet, owner
        and currency mapping. Never substitutes zero on failure.
      responses:
        '200':
          description: Authoritative ledger balance
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Balance'
        '400':
          description: Invalid UUID or currency
        '401':
          description: Missing service key or trusted identity
        '404':
          description: Wallet missing or belongs to another owner
        '503':
          description: Database unavailable or ledger unavailable/malformed
        '409':
          description: Wallet is not ACTIVE and READY
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
  /v1/payments:
    post:
      operationId: submitPayment
      security:
      - BearerAuth: []
      description: Requester-scoped durable idempotency is checked before phone/wallet
        resolution. Same payload returns its original status, even if peers later
        change or fail. New requests confirm the current registered UAE phone and
        eligible wallets. Ledger calls occur only after durable acceptance; uncertain
        results remain PENDING. No automatic wallet creation or funding.
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          pattern: ^[A-Za-z0-9_-]{1,128}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentRequest'
      responses:
        '200':
          description: Existing terminal result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '202':
          description: Durable pending payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid input or missing idempotency key
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid internal credentials or trusted identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Recipient or wallet missing or foreign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Idempotency conflict, recipient changed, wallet ineligible,
            or legacy unresolved row
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Peer unavailable or malformed before acceptance, or local persistence
            unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
    get:
      operationId: paymentHistory
      security:
      - BearerAuth: []
      description: Newest 100 visible payments ordered by created_at and id descending.
        Sender sees all own statuses; recipient sees completed incoming payments only.
        No pagination promise.
      responses:
        '200':
          description: Bounded recent history
          content:
            application/json:
              schema:
                type: object
                required:
                - payments
                properties:
                  payments:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Payment'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      parameters: []
  /v1/payments/page:
    get:
      operationId: paymentHistoryPage
      security:
      - BearerAuth: []
      description: Cursor page ordered by created_at and id descending. Sender sees
        all own statuses; recipient sees completed incoming payments only. Cursors
        are opaque and bound to the authenticated owner and this resource. This is
        a live traversal, not a snapshot; later status changes can change visibility.
        Legacy GET /v1/payments remains unchanged.
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Visible payment page; next_cursor is null when no further page exists
          content:
            application/json:
              schema:
                type: object
                required: [payments, next_cursor]
                properties:
                  payments:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Payment'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidPageRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Authentication or payment service unavailable
  /v1/payments/{id}:
    get:
      operationId: paymentDetails
      security:
      - BearerAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Requester or completed-recipient view
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Payment'
        '400':
          description: Invalid UUID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing, foreign, unresolved legacy, or non-completed incoming
            payment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
  /v1/notifications:
    get:
      operationId: notifications
      security:
      - BearerAuth: []
      description: Newest 100 owner notifications, ordered by created_at and id descending.
        Durable in-app records, no SMS or push delivery.
      responses:
        '200':
          description: Bounded owner notifications
          content:
            application/json:
              schema:
                type: object
                required:
                - notifications
                properties:
                  notifications:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Notification'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
      parameters: []
  /v1/notifications/page:
    get:
      operationId: notificationsPage
      security:
      - BearerAuth: []
      description: Owner-only cursor page ordered by created_at and id descending.
        Cursors are opaque and bound to the authenticated owner and this resource.
        Read-state updates do not change the ordering. This is a live traversal,
        not a snapshot. Legacy GET /v1/notifications remains unchanged.
      parameters:
      - $ref: '#/components/parameters/PageLimit'
      - $ref: '#/components/parameters/PageCursor'
      responses:
        '200':
          description: Owner notification page; next_cursor is null when no further page exists
          content:
            application/json:
              schema:
                type: object
                required: [notifications, next_cursor]
                properties:
                  notifications:
                    type: array
                    maxItems: 100
                    items:
                      $ref: '#/components/schemas/Notification'
                  next_cursor:
                    $ref: '#/components/schemas/NextCursor'
        '400':
          $ref: '#/components/responses/InvalidPageRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          description: Authentication or payment service unavailable
  /v1/notifications/{id}/read:
    post:
      operationId: readNotification
      security:
      - BearerAuth: []
      description: Requires an empty body. Repeated reads preserve the original read_at
        timestamp.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Updated notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '400':
          description: Invalid UUID or non-empty body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Unauthenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Missing or foreign notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          description: Persistence unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: 'Request or concurrency limit; Retry-After: 60'
components:
  parameters:
    PageLimit:
      name: limit
      in: query
      required: false
      description: Canonical decimal digits only, without leading zeros. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 50
    PageCursor:
      name: cursor
      in: query
      required: false
      description: Pass next_cursor unchanged; omit for the first page. Only canonical
        URL-safe values are accepted. Raw page query is limited to 1024 characters;
        unknown, repeated, blank or malformed parameters are rejected.
      schema:
        type: string
        minLength: 1
        maxLength: 512
        pattern: '^[A-Za-z0-9_-]+$'
  schemas:
    AssistantReply:
      type: object
      additionalProperties: false
      required: [reply, outcome, citations, facts, provenance]
      description: Entire response is limited to 32768 UTF-8 bytes. Render reply as plain text.
      properties:
        reply:
          type: string
          minLength: 1
          maxLength: 8000
        outcome:
          type: string
          enum: [answered, insufficient_evidence, empty_history, conflicting_evidence]
        citations:
          type: array
          maxItems: 6
          items:
            type: object
            additionalProperties: false
            required: [document_id, version, section, excerpt]
            properties:
              document_id: {type: string, minLength: 1, maxLength: 128}
              version: {type: string, minLength: 1, maxLength: 64}
              section: {type: string, minLength: 1, maxLength: 256}
              excerpt: {type: string, minLength: 1, maxLength: 1000}
        facts:
          type: object
          additionalProperties: false
          required: [wallets, last_transaction]
          properties:
            wallets:
              type: array
              nullable: true
              maxItems: 10
              items:
                type: object
                additionalProperties: false
                required: [wallet_id, currency, balance_minor]
                properties:
                  wallet_id: {type: string, format: uuid}
                  currency: {type: string, enum: [AED]}
                  balance_minor: {type: integer, format: int64, minimum: 0}
            last_transaction:
              type: object
              nullable: true
              additionalProperties: false
              required: [id, created_at, currency, amount_minor, direction, status]
              properties:
                id: {type: string, format: uuid}
                created_at: {type: string, format: date-time}
                currency: {type: string, enum: [AED]}
                amount_minor: {type: integer, format: int64, minimum: 1}
                direction: {type: string, enum: [incoming, outgoing]}
                status: {type: string, enum: [PENDING, COMPLETED, REJECTED]}
        provenance:
          type: array
          maxItems: 3
          description: At most one entry for each source.
          items:
            type: object
            additionalProperties: false
            required: [source, fetched_at, scope]
            properties:
              source: {type: string, enum: [wallet-service, payment-service, policy-index]}
              fetched_at: {type: string, format: date-time}
              scope: {type: string, minLength: 1, maxLength: 128}
    NextCursor:
      type: string
      nullable: true
      minLength: 1
      maxLength: 512
      pattern: '^[A-Za-z0-9_-]+$'
    Wallet:
      type: object
      required:
      - id
      - owner_id
      - currency
      - status
      - provisioning_status
      - ledger_account_id
      properties:
        id:
          type: string
          format: uuid
        owner_id:
          type: string
          format: uuid
        currency:
          type: string
          enum:
          - AED
        status:
          type: string
          enum:
          - ACTIVE
          - CLOSED
        provisioning_status:
          type: string
          enum:
          - PENDING
          - READY
          description: READY proves a confirmed ledger mapping, not funding.
        ledger_account_id:
          type: string
        …13649 tokens truncated…, id)` keys, not offsets;
this is not a historical snapshot. See [pagination ADR](docs/adr/0018-cursor-pagination.md).

New registrations require a unique immutable UAE mobile number. Auth reserves it
across legacy and SSO identities, then idempotently binds it in user-service before
issuing a session. Keycloak requires the number as its username. Registration is not
ownership proof: claimed phones with a profile resolve even while phone_verified is
false. No SMS, push provider or external verification service is connected. Lookup
is exact and limited to 30 attempts per requester per 60 seconds, including misses.
It reveals the matched display name, not email or a user directory. Public phone
changes are disabled. Historical accepted payments remain readable and replayable.
See [ADR 0014](docs/adr/0014-uae-registration-phone.md) for enrollment failure recovery,
provider-account collisions and historical-user migration limits.

The native clients expose wallets, transfers, notifications and profile. Amounts use
exact Int64/Long minor units. An uncertain command/key is retained in device-only
Keychain (iOS) or Keystore-backed encrypted storage (Android), scoped per origin and
identity across restart/logout; retry uses the same payload. Foreground/manual refresh
fetches in-app notifications; no background delivery or OS push is promised.
Existing scaffold payment rows without recipient/account mappings are not executed or
exposed. See [M1](docs/m1.md) for acceptance and remaining scope.

## Agent team

Agents run for specific tasks inside Codex; they are not bank containers or permanent
background processes. The main chat acts as the orchestrator. Up to three workers run
concurrently; other roles run in waves, and only roles needed for the task are activated.
Models/permissions are inherited from the session; instructions are not a security sandbox.

