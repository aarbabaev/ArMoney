# Explicit overlay: docker compose -f compose.yaml -f compose.sso.yaml up --build -d
services:
  auth-service:
    environment:
      SSO_ISSUER: https://${ARMONEY_HOST:-localhost}:8443/sso/realms/armoney
      SSO_INTROSPECTION_URL: http://sso-service:8080/sso/realms/armoney/protocol/openid-connect/token/introspect
      SSO_CLIENT_ID: armoney-auth
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?Set a random SSO_CLIENT_SECRET}
  sso-service:
    image: quay.io/keycloak/keycloak:26.7.4
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://sso-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${SSO_DB_PASSWORD:?Set a random SSO_DB_PASSWORD}
      KC_HTTP_ENABLED: "true"
      KC_HTTP_RELATIVE_PATH: /sso
      KC_HOSTNAME: https://${ARMONEY_HOST:-localhost}:8443
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${SSO_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${SSO_ADMIN_PASSWORD:?Set a random SSO_ADMIN_PASSWORD}
      SSO_CLIENT_SECRET: ${SSO_CLIENT_SECRET:?Set a random SSO_CLIENT_SECRET}
    volumes:
      - ./sso-service/armoney-realm.json:/opt/keycloak/data/import/armoney-realm.json:ro
    depends_on:
      sso-db:
        condition: service_healthy
    networks: [bank]
  sso-db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${SSO_DB_PASSWORD:?Set a random SSO_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 3s
      timeout: 3s
      retries: 30
    volumes: [sso-db:/var/lib/postgresql/data]
    networks: [bank]
  edge:
    image: caddy:2.11.4-alpine
    environment:
      ARMONEY_HOST: ${ARMONEY_HOST:-localhost}
    ports: ["${ARMONEY_BIND_ADDRESS:-127.0.0.1}:8443:443"]
    volumes:
      - ./infra/edge/Caddyfile:/etc/caddy/Caddyfile:ro
      - edge-data:/data
      - edge-config:/config
    networks: [bank]
volumes:
  sso-db:
  edge-data:
  edge-config:
